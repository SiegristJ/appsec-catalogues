notes: []
residual_risk: >-
  Coverage is bounded by the methods used; no combination guarantees absence of flaws. The method table
  reflects the Claude source report’s synthesis and should be checked by a testing specialist.
residual_rating: Strong if verified
residual_summary: Practices that lapse; detection tuning
facts: []
sources: [R-5, R-107, R-140]
last_reviewed: 2026-10-12
watch: OWASP WSTG releases; ASVS updates.
extra_tables:
- title: null
  rows:
  - [Method, Finds well, Misses]
  - - Static analysis (SAST)
    - Injection sinks, dangerous APIs, secrets, taint flows
    - Authorisation logic, configuration; produces false positives
  - - Composition analysis (SCA)
    - Known-vulnerable components
    - Malicious packages without advisories
  - - Dynamic scanning (DAST)
    - Runtime misconfiguration, reflected injection, missing headers
    - Deep logic, object-level authorisation, uncrawled paths
  - - Interactive testing (IAST)
    - Confirmed runtime data flows
    - Paths not exercised
  - [Fuzzing, Parser crashes and edge cases, Semantic logic errors]
  - [Manual review, 'Design, logic and authorisation flaws', Scale]
  - - Penetration testing
    - Chained, creative exploitation
    - Point-in-time, scope-limited
  - - Bug bounty or disclosure programme
    - Long-tail real-world findings
    - Guaranteed coverage
