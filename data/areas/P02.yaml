id: P2
title: Security testing and verification
group: process
lead: >-
  Each testing method finds some flaw classes and misses others, so assurance comes from combining them
  against a stated ASVS level. Authorisation and business-logic flaws, the highest-impact classes in A3
  and A10, are the ones automated tools miss most.
applies_when:
  text: Always, to the delivery organisation.
  universal: false
  features: []
cross_references: null
threats:
- id: T-P2-1
  name: Undetected defects
  mechanism: Flaw classes that the chosen methods cannot see reach production
  references: []
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
controls:
- id: C-P2-1
  statement: >-
    Verify each application against its assigned ASVS level using the OWASP Web Security Testing Guide
  addresses: [T-P2-1]
  asvs: [All]
  type: baseline
  type_text: Baseline
  disputed: false
  requirement: null
  verify: null
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: C-P2-2
  statement: >-
    Combine static, composition and dynamic analysis in the pipeline and gate releases on agreed severities
  addresses: [T-P2-1]
  asvs: [V15]
  type: baseline
  type_text: Baseline
  disputed: false
  requirement: null
  verify: null
  last_changed: 1.0.0-beta.1
