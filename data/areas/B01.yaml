residual_risk: >-
  Exploitation is accelerating while patching slows (F-24, F-25), so some exposure between disclosure
  and fix is unavoidable. Shrinking the internet-facing surface reduces what can be hit in that window
  more reliably than faster patching alone.
residual_rating: Partial
residual_summary: Window between disclosure and patch
facts: [F-20, F-24, F-25, F-47, F-48, F-49]
