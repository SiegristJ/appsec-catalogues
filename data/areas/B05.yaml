residual_risk: >-
  Backups untested under realistic conditions often restore slower than planned or not at all. CISA cautions
  that immutable storage can be costly when misconfigured and may not meet every compliance requirement.
residual_rating: Strong if verified
residual_summary: Untested restores
facts: [F-23]
sources: [R-16, R-21, R-68, R-69, R-103]
