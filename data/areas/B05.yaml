id: B5
title: Data stores, backups and resilience
group: hosting
lead: >-
  Ransomware featured in 48% of breaches in DBIR 2026 (F-23), and many variants hunt for reachable backups
  before encrypting. Data-store security therefore covers two questions: can an attacker reach the data,
  and can the organisation restore it when everything reachable is lost?
applies_when:
  text: >-
    Owned databases, caches, search clusters or object stores; availability or resilience obligations.
  universal: false
  features: [multi_tenant, owned_data_stores, availability_obligations]
cross_references: null
threats:
- id: T-B5-1
  name: Exposed data stores
  mechanism: >-
    Databases or search clusters reachable from the internet, sometimes without authentication
  references: [CWE-306]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B5-2
  name: Over-privileged application accounts
  mechanism: One shared superuser account gives any code flaw full data access
  references: [CWE-250]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B5-3
  name: Ransomware and destruction of backups
  mechanism: Attackers encrypt or delete primary data and every backup they can reach
  references: []
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B5-4
  name: Resource exhaustion
  mechanism: Expensive queries or connection floods exhaust database capacity
  references: [CWE-770]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B5-5
  name: Sensitive data in server caches
  mechanism: Load balancers or application caches retain sensitive responses
  references: [CWE-524]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
