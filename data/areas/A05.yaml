id: A5
title: Client-side attacks
group: application
lead: >-
  The browser runs whatever script reaches the page with the page’s full authority, and whether it attaches
  cookies to cross-site requests depends on SameSite settings and browser defaults. Most client-side defence
  therefore combines output that cannot execute, policies that restrict what may execute, and request
  checks that tell same-site intent from cross-site forgery. Cross-site scripting tops the 2025 CWE Top
  25 (F-27).
applies_when:
  text: >-
    All. C-A5-2 applies to user-authored rich text; C-A5-8 to APIs called cross-origin; C-A5-10 to pages
    using `postMessage`.
  universal: true
  features: [websockets, third_party_scripts]
cross_references: >-
  Third-party scripts that turn malicious (Magecart) are homed in A11; cross-site WebSocket hijacking
  in A8.
threats:
- id: T-A5-1
  name: Cross-site scripting
  mechanism: >-
    Untrusted data rendered as markup or passed to a script sink executes in the page (reflected, stored,
    DOM-based)
  references: [CWE-79]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A5-2
  name: Cross-site request forgery
  mechanism: >-
    Another site causes the browser to send an authenticated state-changing request
  references: [CWE-352]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A5-3
  name: Clickjacking
  mechanism: The page is framed invisibly and the user is tricked into clicking
  references: [CWE-1021]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A5-4
  name: Open redirect
  mechanism: >-
    An unvalidated redirect target sends users, or OAuth codes and tokens, to an attacker
  references: [CWE-601]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A5-5
  name: CORS misconfiguration
  mechanism: >-
    The server reflects any `Origin` with credentials, trusts `null`, or matches origins by loose pattern,
    letting other sites read responses
  references: [CWE-942]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A5-6
  name: Prototype pollution
  mechanism: >-
    Merging attacker-controlled keys (`__proto__`, `constructor`) alters shared object prototypes and
    reaches gadgets
  references: [CWE-1321]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A5-7
  name: Unchecked `postMessage`
  mechanism: Handlers accept messages from any origin, or senders post to any origin
  references: [CWE-346]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A5-8
  name: Cross-site leaks
  mechanism: >-
    Side channels (timing, response length, redirects, connection-pool behaviour) reveal cross-origin
    state such as login status or search results
  references: [CWE-203]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A5-9
  name: Script gadgets
  mechanism: >-
    Legitimate code in trusted libraries turns injected, inert-looking markup into script execution, bypassing
    sanitisers and CSP
  references: [CWE-79]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A5-10
  name: Token theft from script-readable storage
  mechanism: >-
    Session tokens kept in `localStorage` or readable cookies are exfiltrated by any XSS
  references: [CWE-922]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
