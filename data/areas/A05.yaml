notes: []
residual_risk: >-
  Cross-site leaks have no single fix; browsers close individual oracles as they are found, and new ones
  keep appearing (two in PortSwigger’s 2025 top ten, F-28). Script gadgets in older frameworks can defeat
  a strict CSP, so Trusted Types and library choice matter. SameSite does not stop requests from sibling
  subdomains, which share a site.
residual_rating: Partial
residual_summary: Cross-site leaks; script gadgets in older frameworks
facts: [F-27, F-28, F-34]
sources: [R-2, R-26, R-43, R-44, R-45, R-46, R-47, R-48, R-49, R-50, R-59, R-85]
last_reviewed: 2026-10-12
watch: >-
