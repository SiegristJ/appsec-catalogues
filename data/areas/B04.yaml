  references: []
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B4-5
  name: DNS hijacking and certificate mis-issuance
  mechanism: >-
    Registrar or DNS compromise redirects traffic or enables certificates for the attacker
  references: []
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
