notes: []
residual_risk: >-
  WAFs stop commodity attacks and buy time through virtual patching, but parsing-based bypasses are systematic,
  not incidental. DDoS capacity is an arms race. DNS and registrar controls often sit outside the application
  team and need explicit ownership.
residual_rating: Partial
residual_summary: WAF bypass; DDoS capacity
facts: [F-52, F-53]
sources: [R-100, R-101, R-102, R-117, R-118, R-135, R-136, R-137, R-138]
last_reviewed: 2026-10-12
watch: >-
  WAF bypass research; PCI DSS 6.4.2 guidance; registrar and DNS security practice.
