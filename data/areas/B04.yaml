id: B4
title: Network and edge
group: hosting
lead: >-
  The edge absorbs volumetric attacks, filters commodity exploits and hides the origin, but each of those
  functions fails if traffic can go around it or if it parses requests differently from the application.
  Peer-reviewed fuzzing found 1,207 WAF bypasses across five major WAFs by exploiting such parsing differences
  (F-52).
applies_when:
  text: >-
    A CDN, WAF, load balancer or reverse proxy fronts the application; availability targets apply. C-B4-5
    applies to all.
  universal: false
  features: [edge_intermediaries, availability_obligations]
cross_references: null
threats:
- id: T-B4-1
  name: Denial of service
  mechanism: Volumetric or application-layer floods exhaust capacity
  references: [CWE-400]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B4-2
  name: Origin bypass
  mechanism: Attackers reach the origin directly, skipping CDN and WAF controls
  references: []
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B4-3
  name: WAF evasion
  mechanism: >-
    Malformed multipart, XML or JSON structure, or Unicode that the backend narrows to ASCII (“Ghost Bits”,
    Java), passes the WAF and is reconstructed by the application
  references: [CWE-436]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B4-4
  name: Subdomain takeover
  mechanism: >-
