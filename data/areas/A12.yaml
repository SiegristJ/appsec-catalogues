notes: []
residual_risk: >-
  Prompt injection is not expected to be fully preventable, so residual risk is set by how much authority
  the model can exercise and how quickly misuse is detected. The agentic risk list is a first edition
  (2026) and controls for multi-agent systems are immature. Veracode’s figures come from a vendor benchmark
  on curated tasks; treat them as indicative.
residual_rating: Partial
residual_summary: Prompt injection is not expected to be fully preventable
facts: [F-8, F-9, F-42, F-43, F-44]
sources: [R-12, R-13, R-73, R-74, R-75, R-76, R-126]
last_reviewed: 2026-10-12
