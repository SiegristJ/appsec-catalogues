id: A12
title: AI/LLM features and AI-generated code
group: application
lead: >-
  A language model cannot reliably tell instructions from data, so any content it reads can steer it.
  The UK NCSC judges that prompt injection may never be fully mitigated the way SQL injection can (F-42).
  The defensible design assumes the model will be manipulated and bounds what it can then do: authority
  enforced outside the model, least privilege for tools, human approval for consequential actions, and
  model output treated as untrusted input.
applies_when:
  text: >-
    LLM features, agents or tool calling (T-A12-1 to T-A12-7). T-A12-8 and C-A12-11 apply when AI coding
    assistants help build the application.
  universal: false
  features: [llm_features, ai_coding_assistants]
cross_references: null
threats:
- id: T-A12-1
  name: Prompt injection
  mechanism: >-
    Instructions in user input or in content the model reads (pages, documents, emails, tool results)
    redirect its behaviour or goals
  references: ['LLM01:2025', ASI01]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A12-2
  name: Excessive agency and tool misuse
  mechanism: >-
    The model or agent invokes tools or uses delegated credentials beyond what the user intended or is
    entitled to
  references: ['LLM06:2025', ASI02, ASI03]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A12-3
  name: Improper output handling
  mechanism: >-
    Model output reaches HTML, SQL, shell or other sinks without encoding, recreating classic injection
  references: ['LLM05:2025']
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A12-4
  name: Sensitive information and system prompt disclosure
  mechanism: The model reveals data from its context, training or system prompt
  references: ['LLM02:2025', 'LLM07:2025']
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A12-5
  name: Retrieval and memory poisoning or leakage
  mechanism: >-
    Vector stores return another tenant’s data, or poisoned documents and memories steer later responses
  references: ['LLM08:2025', ASI06]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A12-6
  name: AI supply chain
  mechanism: >-
    Malicious or compromised models, datasets, tools or tool servers enter the system
  references: ['LLM03:2025', ASI04]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A12-7
  name: Unbounded consumption
  mechanism: Inputs or agent loops drive excessive tokens, calls or cost
  references: ['LLM10:2025']
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A12-8
  name: Insecure AI-generated code
  mechanism: >-
    Assistants produce code with known vulnerability classes; in Veracode’s benchmark about 44% of tasks
    introduced one, with no improvement from larger models (F-43)
  references: [Veracode 2026]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-A12-9
  name: Hallucinated dependencies
  mechanism: >-
    Assistants suggest package names that do not exist, which attackers then register
  references: []
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
