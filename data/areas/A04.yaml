notes: []
residual_risk: >-
  Framework defaults close classic SQL injection, but it still ranks second by CVE volume (F-27) because
  legacy and hand-built query paths persist. Newer classes evade older assumptions: ORM leaks need no
  syntax injection at all, and error-based template injection works without visible output. Deserialisation
  flaws often sit in transitive dependencies (A11).
residual_rating: Closable
residual_summary: >-
  Legacy and hand-built query paths; newer classes (ORM leaks, error-based template injection)
facts: [F-27, F-31, F-32, F-33]
sources: [R-2, R-26, R-37, R-38, R-39, R-40, R-41, R-42, R-66, R-113, R-114]
last_reviewed: 2026-10-12
watch: >-
  annual CWE Top 25; PortSwigger top ten; OWASP cheat-sheet revisions for injection and deserialisation.
extra_tables: []
