id: B3
title: Containers, Kubernetes and serverless
group: hosting
lead: >-
  Containers and functions shrink the unit of deployment but add a control plane, an image supply chain
  and event sources, each with its own attack path. In Kubernetes the decisive settings are pod privileges,
  service-account permissions and network policy. In serverless they are the function’s role and what
  persists between invocations.
applies_when:
  text: >-
    Containers or Kubernetes (T-B3-1 to T-B3-5); serverless functions (T-B3-6).
  universal: false
  features: [containers_kubernetes, serverless]
cross_references: null
threats:
- id: T-B3-1
  name: Vulnerable or malicious images
  mechanism: Base or application images carry known vulnerabilities or attacker code
  references: [CWE-1395]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B3-2
  name: Container escape
  mechanism: >-
    Privileged containers, host namespaces or host mounts let a compromised workload reach the node
  references: [CWE-250]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B3-3
  name: Service-account and RBAC abuse
  mechanism: >-
    A token mounted in the pod, read through file access or file-capable SSRF, is used against the API
    server; impact depends on the RBAC bindings granted
  references: [CWE-269]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B3-4
  name: Cluster add-on flaws
  mechanism: >-
    Admission controllers and ingress controllers become entry points (ingress-nginx CVE-2025-1974; Kyverno
    CVE-2026-4789, which requires permission to create namespaced policies)
  references: []
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B3-5
  name: Flat pod networks
  mechanism: Any compromised pod can reach every other service
  references: [CWE-923]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
- id: T-B3-6
  name: Serverless-specific abuse
  mechanism: >-
    Untrusted event data from queues, storage or streams; over-privileged function roles; secrets or user
    data left in globals or `/tmp` leaking to later requests; cost exhaustion
  references: [CWE-20]
  last_changed: 1.0.0-beta.1
  status: current
  replaced_by: []
