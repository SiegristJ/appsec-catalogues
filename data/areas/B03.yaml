residual_risk: >-
  Unpatched runtime and kernel flaws can still allow escape, so runtime detection complements prevention.
  Unmaintained add-ons accumulate unfixed vulnerabilities; the ingress-nginx retirement is the current
  case (F-51).
residual_rating: Strong if verified
residual_summary: Runtime and kernel zero-days; unmaintained add-ons
facts: [F-51]
sources: [R-94, R-95, R-96, R-97, R-98, R-99, R-115, R-134]
last_reviewed: 2026-10-12
watch: >-
