# Maintenance watch list (stage 9, SETUP-INSTRUCTIONS 10.1 owner setup).
#
# One entry per area, keyed by area ID; each value is that area's `watch`
# line from data/areas/<area>.yaml, VERBATIM. This file is a view over the
# corpus, not a second source of truth: regenerate it whenever an area's
# watch line changes, from the repository root, with
#
#     python -c "import glob, yaml; from pathlib import Path; \
#       print(yaml.safe_dump({yaml.safe_load(Path(p).read_text())['id']: \
#         yaml.safe_load(Path(p).read_text())['watch'] \
#         for p in sorted(glob.glob('data/areas/*.yaml'))}, \
#         allow_unicode=True, sort_keys=True, width=9999))" \
#       > runbook/watch-list.yaml
#
# (write the header comment back first). The owner reviews this list on the
# maintenance cadence (data/maintenance.md, rendered as Appendix C, and
# runbook/maintenance-runbook.md). Fast-moving material that is not yet in
# standards belongs in emerging/emerging-threats.md instead, under its own
# evidentiary standard.
